<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- V3 "橙 π" — 黑 squircle + 品牌橙 π（同构异色，最强辨识度） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2904d"/>
      <stop offset="1" stop-color="#d5651f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g transform="translate(512 500) skewX(-9) translate(-512 -500)" fill="url(#pi)">
    <rect x="266" y="344" width="492" height="92"/>
    <rect x="306" y="344" width="92" height="376"/>
    <rect x="566" y="280" width="92" height="440"/>
  </g>
</svg>
