<?xml version="1.0" encoding="UTF-8"?>
<!--
  PiCode app icon master — ticket 102, proposal V2 "π + terminal cursor"
  (Q22 final pick; proposal source: .scratch/picode-1-7/icon-proposals/v2-pi-cursor.svg,
  geometry identical to that approved final).

  Single source of truth for every icon surface. Self-drawn geometric paths
  only — no font dependencies, no embedded bitmaps, no third-party assets
  (red line: ZCode icon assets never enter this repo; the π glyph is drawn
  from plain rects with a skew transform).

  Palette: squircle #262626→#0f0f0f (vertical micro-gradient), π #ffffff,
  cursor #ec7931 (brand orange — the "agent at work" terminal block).

  Regenerate the rasters after any change here:
    node scripts/make-icons.mjs
    → build/icon.png (1024) · build/icons/{16,32,64,128,256,512,1024}.png
    → build/icon.icns (every iconset slot) · build/icon.iconset/ (derived, untracked)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g transform="translate(452 500) skewX(-9) translate(-512 -500)" fill="#ffffff">
    <rect x="266" y="344" width="492" height="92"/>
    <rect x="306" y="344" width="92" height="376"/>
    <rect x="566" y="280" width="92" height="440"/>
  </g>
  <rect x="676" y="600" width="82" height="104" rx="12" fill="#ec7931"/>
</svg>
